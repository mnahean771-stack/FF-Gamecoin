<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f7fa;--card:#fff;--ink:#14213d;--mute:#64748b;--line:#e5e9f0;--pri:#1e40af;--pri2:#eef2ff;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--info:#1d4ed8;--infob:#dbeafe}
*{box-sizing:border-box;margin:0}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Hind Siliguri",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font-weight:500;background:var(--pri);color:#fff}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.b-ok{background:var(--ok)}.b-bad{background:var(--bad)}.b-gr{background:#fff;color:var(--ink);border:1px solid var(--line)}.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);margin:4px 0}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px}
#login h1{font-size:20px;margin-bottom:4px}#login p{color:var(--mute);margin-bottom:14px}
#login button{width:100%;margin-top:10px;padding:10px}
#err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .logo{font-weight:700;font-size:17px;padding:4px 10px 16px}
aside nav{display:flex;flex-direction:column;gap:2px;flex:1}
aside nav button{background:none;color:var(--mute);text-align:left;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
aside nav button:hover{background:var(--bg);filter:none}
aside nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
.cnt{background:var(--warnb);color:var(--warn);border-radius:99px;font-size:12px;padding:0 8px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:19px}.top span{color:var(--mute);font-size:13px}
main{padding:22px 24px;max-width:1100px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat small{color:var(--mute)}.stat b{display:block;font-size:26px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
th{color:var(--mute);font-weight:600;background:#fafbfd;white-space:nowrap}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pending{background:var(--warnb);color:var(--warn)}.processing{background:var(--infob);color:var(--info)}.completed{background:var(--okb);color:var(--ok)}.cancelled{background:var(--badb);color:var(--bad)}
.th{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--pri2);display:block}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{background:#fff;color:var(--mute);border:1px solid var(--line)}.filters button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.up{display:flex;align-items:center;gap:10px;margin:6px 0}
.lbl{position:relative;display:inline-block;padding:8px 12px;border:1px dashed #b7c2d6;border-radius:8px;color:var(--mute);overflow:hidden;cursor:pointer;font-size:14px}
.lbl input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;margin:0}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0}.chk input{width:auto;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;place-items:center;padding:20px;z-index:40}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:400px}
.modal label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.modal .acts{justify-content:flex-end;margin-top:16px}
#ann{background:var(--pri);color:#fff;padding:8px 24px;font-size:13px}
@media(max-width:820px){
#app{grid-template-columns:1fr}
aside{position:static;height:auto;flex-direction:row;align-items:center;padding:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
aside .logo,#out{display:none}
aside nav{flex-direction:row}aside nav button{white-space:nowrap}
main{padding:14px}.top{padding:12px 14px}
}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>অ্যাডমিন লগইন</h1>
    <p>শুধু অ্যাডমিনরা ঢুকতে পারবেন।</p>

    <button id="lb">লগইন করুন</button>
    <div id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <aside>
    <div class="logo">FF Gamecoin</div>
    <nav id="nav"></nav>
    <button id="out" class="b-gr sm">লগআউট</button>
  </aside>
  <div>
    <div id="ann" hidden></div>
    <div class="top"><h1 id="ttl"></h1><span id="who"></span></div>

</div>

<div class="modal" id="edm"><div class="box"><h2 id="edT" style="font-size:17px"></h2><div id="edF"></div><div class="acts"><button class="b-gr" onclick="edClose()">বাতিল</button><button id="edB" onclick="edSave()">সেভ করুন</button></div></div></div>

<div id="toast"></div>

/* ---------- সাইটের "Recent Orders" ফিড (সর্বশেষ ১০টা অর্ডার সাইটে দেখানোর জন্য) ---------- */
let feedT = null;
function syncFeed(){
  clearTimeout(feedT);
  feedT = setTimeout(() => {
    if(!auth.currentUser) return;
    const feed = S.orders.slice(0, 10).map(o => {
      const u = fnd(S.users, o.userId) || {};
      let name = String(u.name || "").trim();
      if(!name){ const e = String(o.userEmail || "").split("@")[0]; name = e ? e.slice(0, 3) + "***" : "User"; }
      const q = Number(o.quantity) || 1;
      return {name:name.slice(0, 24), item:String(o.productName || "") + (q > 1 ? " x" + q : ""), status:o.status || "pending", t:(o.createdAt && o.createdAt.seconds) || 0};
    });
    if(JSON.stringify(feed) === JSON.stringify(S.site.recent || [])) return;
    setDoc(doc(db, ...SETTINGS), {recent:feed}, {merge:true}).catch(e => console.warn("feed:", e.code));
  }, 2500);
}

const BADGE_COLORS = ["#2563eb","#d97706","#ea580c","#16a34a","#dc2626","#9333ea","#0891b2","#db2777","#111827"];
function colorField(id, val){
  const cur = /^#[0-9a-fA-F]{6}$/.test(val || "") ? val : "";
  return `<div class="up" style="flex-wrap:wrap"><input type="color" id="${id}_c" value="${cur || "#2563eb"}" style="width:54px;height:40px;padding:2px;margin:0" oninput="document.getElementById('${id}').value=this.value"><input id="${id}" value="${esc(cur)}" placeholder="#2563eb (ফাঁকা = নীল)" style="flex:1;min-width:130px;margin:0" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value))document.getElementById('${id}_c').value=this.value"></div><div class="acts" style="margin:4px 0 2px">${BADGE_COLORS.map(c => `<button type="button" title="${c}" style="background:${c};width:28px;height:28px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1" onclick="document.getElementById('${id}').value='${c}';document.getElementById('${id}_c').value='${c}'"></button>`).join("")}</div>`;
}
const badgeTag = c => c && c.badge ? `<span class="tag" style="background:${/^#[0-9a-fA-F]{6}$/.test(c.badgeColor||"") ? c.badgeColor : "#2563eb"};color:#fff">${esc(c.badge)}</span>` : `<span style="color:var(--mute)">-</span>`;

/* ---------- ছবি আপলোড ---------- */
function imgField(id, val){
  return `<div class="up"><img class="th" id="${id}_p" alt="" src="${esc(val)}"${val?"":' style="visibility:hidden"'}><label class="lbl">ছবি আপলোড করুন<input type="file" accept="image/*" onchange="pick(this,'${id}')"></label><input type="hidden" id="${id}" value="${esc(val)}"></div>`;
}
window.pick = (inp, id) => {
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image();
    im.onload = () => { const s = Math.min(1, 480/Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const d = c.toDataURL("image/jpeg", .8); $(id).value = d;
      const p = $(id+"_p"); p.src = d; p.style.visibility = "visible"; toast("ছবি বাছাই হয়েছে, এবার সেভ করুন"); };
    im.onerror = () => toast("ছবিটা পড়া যায়নি"); im.src = rd.result; };
  rd.readAsDataURL(f);
};

    const txt = (k in R) ? (r.text || "") : (k === "default" ? DEF_RULES : "");
    return `<div class="card" style="background:#fafbfd"><h2 style="font-size:15px">${esc(n)}</h2>
      <textarea id="ru_${k}" rows="5" placeholder="প্রতি লাইনে একটা নিয়ম লিখুন">${esc(txt)}</textarea>
      ${sw("ra_"+k, (k in R) ? r.active !== false : true)}</div>`; }).join("");

  $("main").innerHTML = `
  <div class="card"><h2>Quantity (পরিমাণ বাছাই)</h2>
    <p style="color:var(--mute);margin-bottom:8px">প্রতিটা প্রোডাক্ট পেজে "Quantity  −  1  +" বক্স দেখাবে। ইউজার যত বাড়াবে, দাম তত গুণ হবে।</p>
    ${sw("qe", q.enabled !== false)}
    <label style="font-size:13px;color:var(--mute)">সর্বোচ্চ কতটা কেনা যাবে</label>
    <input id="qm" type="number" min="1" max="100" value="${esc(g(q,"max",10))}" style="max-width:160px">
    <button onclick="sQty()">Quantity সেভ করুন</button></div>

  <div class="card"><h2>Rules &amp; Conditions (প্রতিটা পেজের আলাদা)</h2>
    <p style="color:var(--mute);margin-bottom:10px">প্রতি লাইনে একটা নিয়ম। "চালু রাখুন" বন্ধ করলে ওই পেজ থেকে Rules বক্স লুকিয়ে যাবে। অ্যাডমিন থেকে বানানো প্রোডাক্টের নিজস্ব নিয়ম ফাঁকা থাকলে ডিফল্ট নিয়ম দেখাবে।</p>
    ${ruleCards}<button onclick="sRules()">সব Rules সেভ করুন</button></div>

  <div class="card"><h2>Contact Us (সাইটের নিচে)</h2>
    <p style="color:var(--mute);margin-bottom:8px">সাইটের নিচের Contact Us এ Telegram ও WhatsApp দুটো কার্ড দেখাবে। লিঙ্ক বদলে সেভ করলেই সাইটে বদলে যাবে। WhatsApp ফাঁকা রাখলে ওই কার্ড লুকিয়ে যাবে।</p>
    <label style="font-size:13px;color:var(--mute)">Telegram লিঙ্ক</label>
    <input id="lk_ct" placeholder="https://t.me/yourusername" value="${esc(lk.contactTelegram||"")}">
    <label style="font-size:13px;color:var(--mute)">WhatsApp লিঙ্ক বা নম্বর</label>
    <input id="lk_cw" placeholder="https://wa.me/8801XXXXXXXXX অথবা 8801XXXXXXXXX" value="${esc(lk.contactWhatsapp||"")}">
    <button onclick="sContact()">Contact Us সেভ করুন</button></div>

  <div class="card"><h2>Help বাটন (ডানদিকের নিচের কোণা)</h2>
    <p style="color:var(--mute);margin-bottom:8px">হেল্প বাটন চাপলে যে ৩টা লিঙ্ক খোলে। ফাঁকা রাখলে আগের লিঙ্কই থাকবে।</p>
    <label style="font-size:13px;color:var(--mute)">Telegram লিঙ্ক</label>
    <input id="lk_ht" placeholder="https://t.me/yourchannel" value="${esc(lk.helpTelegram||"")}">
    <label style="font-size:13px;color:var(--mute)">Join Group লিঙ্ক</label>
    <input id="lk_hg" placeholder="https://t.me/yourgroup" value="${esc(lk.helpGroup||"")}">
    <label style="font-size:13px;color:var(--mute)">YouTube লিঙ্ক</label>
    <input id="lk_hy" placeholder="https://youtube.com/@yourchannel" value="${esc(lk.helpYoutube||"")}">
    <button onclick="sHelp()">Help বাটন সেভ করুন</button></div>`;
}
const ck = id => $(id) ? $(id).checked : false;
window.sQty = () => { const m = Math.max(1, Math.min(100, Math.floor(Number(v("qm")) || 10)));
  saveSite({quantity:{enabled:ck("qe"), max:m}}, "Quantity সেভ হয়েছে") };
window.sRules = () => { const o = {};
  RULE_PAGES.forEach(([k]) => { o[k] = {text:v("ru_"+k), active:ck("ra_"+k)} });
  saveSite({rules:o}, "Rules সেভ হয়েছে") };
const urlOk = u => !u || /^(https?:\/\/|mailto:|tel:)/i.test(u) || /^\+?[\d\s-]{7,}$/.test(u) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(u);
window.sContact = () => {
  const t = v("lk_ct").trim(), w = v("lk_cw").trim();
  if(!urlOk(t) || !urlOk(w)){ toast("লিঙ্কটা ঠিক নেই"); return }
  saveSite({links:{contactTelegram:t, contactWhatsapp:w}}, "Contact Us সেভ হয়েছে") };
window.sHelp = () => {
  const a = v("lk_ht").trim(), b = v("lk_hg").trim(), c = v("lk_hy").trim();
  if(!urlOk(a) || !urlOk(b) || !urlOk(c)){ toast("লিঙ্কটা ঠিক নেই"); return }
  saveSite({links:{helpTelegram:a, helpGroup:b, helpYoutube:c}}, "Help বাটনের লিঙ্ক সেভ হয়েছে") };

/* ---------- এডিট ও ডিলিট পপ-আপ ---------- */
let edCb = null;
function openEdit(title, fields, cb, btn){
  edCb = cb; $("edT").textContent = title; $("edB").textContent = btn || "সেভ করুন";
  $("edF").innerHTML = fields.map((f,i) => `<label>${f[0]}</label>` + (f[2]==="img" ? imgField("ef"+i, f[1]) : f[2]==="sel" ? `<select id="ef${i}">${f[3]}</select>` : f[2]==="color" ? colorField("ef"+i, f[1]) : f[2]==="ta" ? `<textarea id="ef${i}" rows="4">${esc(f[1])}</textarea>` : `<input id="ef${i}" type="${f[2]||"text"}" value="${esc(f[1])}">`)).join("");
  $("edm").classList.add("on");
}
window.edSave = () => { const r = []; let i = 0; while($("ef"+i)){ r.push($("ef"+i).value); i++ } $("edm").classList.remove("on"); if(edCb) edCb(r) };
window.edClose = () => $("edm").classList.remove("on");
window.pop = $("pop");
window.del = (col, id) => openEdit("সত্যিই ডিলিট করবেন?", [], () => run(async () => {
  await deleteDoc(doc(db, C[col], id));
  if(col === "categories"){ const b = writeBatch(db); S.products.filter(p => p.categoryId === id).forEach(p => b.delete(doc(db, C.products, p.id))); await b.commit(); }
}, "ডিলিট হয়েছে"), "ডিলিট করুন");
</script>
</body>
</html>
